[package]
name = "apw"
version = "0.5.1"
edition = "2021"
rust-version = "1.88"
description = "Read Apple Passwords on Linux"
license = "GPL-3.0-only"
repository = "https://github.com/win0na/apw"
default-run = "apw"

[[bin]]
name = "apw"
path = "src/main.rs"

[features]
default = ["secret-service", "tui"]
secret-service = ["dep:dbus-secret-service"]
tui = ["dep:opentui"]

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
hmac = "0.12"
rand = "0.8"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
dbus-secret-service = { version = "4.1", features = ["crypto-rust"], optional = true }
num-bigint = "0.5.1"
num-traits = "0.2.19"
pbkdf2 = "0.12.2"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
plist = "1.8.0"
aes = "0.8.4"
cbc = "0.1.2"
p384 = { version = "0.13.1", features = ["ecdsa", "ecdh", "pkcs8"] }
p256 = { version = "0.13.1", features = ["ecdh", "pkcs8"] }
aes-siv = "0.7.0"
hkdf = "0.12.4"
prost = "0.13.5"
flate2 = "1.1"
# `opentui` pins its `opentui-sys` to the same version, and the shim below
# patches only 0.9.7. An unpinned requirement lets an install with no lock file
# resolve a newer `opentui`, whose registry `opentui-sys` then refuses to build.
opentui = { version = "=0.9.7", optional = true, default-features = false, features = ["static"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = "symbols"

[patch.crates-io]
opentui-sys = { path = "opentui-sys" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
